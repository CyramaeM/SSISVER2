{% extends "base.html" %}
{% block title %}Add Student{% endblock %}

{% block content %}
<h2>Add New Student</h2>
<div class="form-container">
    <form action="{{ url_for('students.add_student') }}" method="POST" enctype="multipart/form-data">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        
        <div class="form-group">
            <label for="stud_id">ID Number:</label>
            <input type="text" name="stud_id" id="stud_id" placeholder="Enter ID number" required>
        </div>
        
        <div class="form-group">
            <label for="fname">First Name:</label>
            <input type="text" name="fname" id="fname" placeholder="Enter first name" required>
        </div>
        
        <div class="form-group">
            <label for="lname">Last Name:</label>
            <input type="text" name="lname" id="lname" placeholder="Enter last name" required>
        </div>
        
        <div class="form-group">
            <label for="course">Course:</label>
            <select name="course" id="course" required>
                <option value="">Select Course</option>
                {% for code, name in course_details.items() %}
                    <option value="{{ code }}">{{ name }} ({{ code }})</option>
                {% endfor %}
            </select>
        </div>
        
        <div class="form-group">
            <label for="yearlevel">Year Level:</label>
            <select name="yearlevel" id="yearlevel" required>
                <option value="">Select Year Level</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
            </select>
        </div>
        
        <div class="form-group">
            <label>Gender:</label>
            <div class="radio-group">
                <label>
                    <input type="radio" name="gender" value="Male" required> Male
                </label>
                <label>
                    <input type="radio" name="gender" value="Female"> Female
                </label>
            </div>
        </div>
        
        <div class="form-group">
            <label for="profile_photo">Profile Photo:</label>
            <input type="file" name="profile_photo" id="profile_photo" accept=".png,.jpg,.jpeg,image/png,image/jpeg">
            <small>PNG and JPG/JPEG only (max 5MB)</small>
            <div id="fileError" style="color:red; display:none;"></div>
        </div>
        
        <button type="submit">Add Student</button>
        <a href="{{ url_for('students.home') }}" class="btn-cancel">Cancel</a>
    </form>
</div>

<script>
function validateForm() {
    const fileInput = document.getElementById('profile_photo');
    const fileError = document.getElementById('fileError');
    fileError.style.display = 'none';
    
    if (fileInput.files.length > 0) {
        const file = fileInput.files[0];
        const validExtensions = ['png', 'jpg', 'jpeg'];
        const extension = file.name.split('.').pop().toLowerCase();
        
        // Validate file type
        if (!validExtensions.includes(extension)) {
            fileError.textContent = 'Invalid file type. Only PNG and JPG/JPEG images are allowed.';
            fileError.style.display = 'block';
            return false;
        }
        
        // Validate file size (5MB)
        if (file.size > 5 * 1024 * 1024) {
            fileError.textContent = 'File size exceeds 5MB limit.';
            fileError.style.display = 'block';
            return false;
        }
    }
    
    return true;
}

// Live file validation
document.getElementById('profile_photo').addEventListener('change', function() {
    const fileError = document.getElementById('fileError');
    fileError.style.display = 'none';
    
    if (this.files.length > 0) {
        const file = this.files[0];
        const validExtensions = ['png', 'jpg', 'jpeg'];
        const extension = file.name.split('.').pop().toLowerCase();
        
        if (!validExtensions.includes(extension)) {
            fileError.textContent = 'Invalid file type. Only PNG and JPG/JPEG images are allowed.';
            fileError.style.display = 'block';
            this.value = ''; // Clear the file input
        } else if (file.size > 5 * 1024 * 1024) {
            fileError.textContent = 'File size exceeds 5MB limit.';
            fileError.style.display = 'block';
            this.value = ''; // Clear the file input
        }
    }
});
</script>


{% endblock %}
