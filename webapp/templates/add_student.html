{% extends "base.html" %}
{% block title %}Add Student{% endblock %}

{% block content %}
<h2>Add New Student</h2>
<div class="form-container">
    <form action="{{ url_for('students.add_student') }}" method="POST" enctype="multipart/form-data">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        
        <div class="form-group">
            <label for="stud_id">ID Number:</label>
            <input type="text" name="stud_id" id="stud_id" placeholder="Enter ID number" required>
        </div>
        
        <div class="form-group">
            <label for="fname">First Name:</label>
            <input type="text" name="fname" id="fname" placeholder="Enter first name" required>
        </div>
        
        <div class="form-group">
            <label for="lname">Last Name:</label>
            <input type="text" name="lname" id="lname" placeholder="Enter last name" required>
        </div>
        
        <div class="form-group">
            <label for="course">Course:</label>
            <select name="course" id="course" required>
                <option value="">Select Course</option>
                {% for course in courses %}
                    <option value="{{ course }}">{{ course }}</option>
                {% endfor %}
            </select>
        </div>
        
        <div class="form-group">
            <label for="yearlevel">Year Level:</label>
            <select name="yearlevel" id="yearlevel" required>
                <option value="">Select Year Level</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
            </select>
        </div>
        
        <div class="form-group">
            <label>Gender:</label>
            <div class="radio-group">
                <label>
                    <input type="radio" name="gender" value="Male" required> Male
                </label>
                <label>
                    <input type="radio" name="gender" value="Female"> Female
                </label>
            </div>
        </div>
        
        <div class="form-group">
            <label for="profile_photo">Profile Photo:</label>
            <input type="file" name="profile_photo" id="profile_photo" accept="image/*">
            <small>JPG, PNG, or JPEG (max 5MB)</small>
        </div>
        
        <button type="submit">Add Student</button>
        <a href="{{ url_for('students.home') }}" class="btn-cancel">Cancel</a>
    </form>
</div>

<style>
    .form-container {
        max-width: 600px;
        margin: 0 auto;
        padding: 20px;
        background: #f9f9f9;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    
    .form-group {
        margin-bottom: 15px;
    }
    
    label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
    }
    
    input[type="text"],
    select {
        width: 100%;
        padding: 8px;
        border: 1px solid #ddd;
        border-radius: 4px;
    }
    
    .radio-group {
        display: flex;
        gap: 15px;
    }
    
    .radio-group label {
        display: flex;
        align-items: center;
        font-weight: normal;
    }
    
    button[type="submit"] {
        background: #4CAF50;
        color: white;
        padding: 10px 15px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
    }
    
    .btn-cancel {
        background: #f44336;
        color: white;
        padding: 10px 15px;
        border: none;
        border-radius: 4px;
        text-decoration: none;
        display: inline-block;
        margin-left: 10px;
    }
</style>
{% endblock %}
