{% extends "base.html" %}

{% block title %}Edit Student{% endblock %}

{% block content %}
<div class="form-container">
    <h1>Edit Student</h1>
    <form id="editStudentForm" action="{{ url_for('students.edit_student', student_id=student.id_number) }}" method="POST" enctype="multipart/form-data">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        
        <!-- Profile Photo Preview -->
        <div class="form-group">
            <label>Current Profile Photo:</label>
            <div id="prof" style="display:flex;align-items:center;justify-content:center;">
                {% if student.profile %}
                    <img id="profilePreview" src="{{ student.profile }}" style="width:150px;height:150px;object-fit:cover;border-radius:50%;">
                {% else %}
                    <div id="profilePreview" style="width:150px;height:150px;background:#eee;border-radius:50%;display:flex;align-items:center;justify-content:center;">
                        No Image
                    </div>
                {% endif %}
            </div>
            
            <!-- Remove Photo Option -->
            {% if student.profile %}
            <div style="margin-top: 10px;">
                <label>
                    <input type="checkbox" name="remove_photo" id="remove_photo">
                    Remove current photo
                </label>
            </div>
            {% endif %}
        </div>
        
        <!-- New Photo Upload -->
        <div class="form-group">
            <label for="profile_photo">Update Profile Photo:</label>
            <input type="file" name="profile_photo" id="profile_photo" accept="image/*" onchange="previewImage(event)">
            <small>JPG, PNG, or JPEG (max 5MB)</small>
        </div>
        
        <!-- ID Number -->
        <div class="form-group">
            <label for="id_number">ID Number:</label>
            <input type="text" name="id_number" id="id_number" value="{{ student.id_number }}" readonly required>
        </div>
        
        <!-- First Name -->
        <div class="form-group">
            <label for="fname">First Name:</label>
            <input type="text" name="fname" id="fname" value="{{ student.fname }}" required>
        </div>
        
        <!-- Last Name -->
        <div class="form-group">
            <label for="lname">Last Name:</label>
            <input type="text" name="lname" id="lname" value="{{ student.lname }}" required>
        </div>
        
        <!-- Course Dropdown -->
        <div class="form-group">
            <label for="course">Course:</label>
            <select name="course" id="course" required>
                {% for code, name in courses.items() %}
                    <option value="{{ code }}" 
                        {% if student.course == code %}selected{% endif %}>
                        {{ name }} ({{ code }})
                    </option>
                {% endfor %}
            </select>
        </div>
        
        <!-- Year Level Dropdown -->
        <div class="form-group">
            <label for="yearlevel">Year Level:</label>
            <select name="yearlevel" id="yearlevel" required>
                {% for level in year_levels %}
                    <option value="{{ level }}" 
                        {% if student.yearlevel == level %}selected{% endif %}>
                        {{ level }}
                    </option>
                {% endfor %}
            </select>
        </div>
        
        <!-- Gender Dropdown -->
        <div class="form-group">
            <label for="gender">Gender:</label>
            <select name="gender" id="gender" required>
                {% for gender_option in genders %}
                    <option value="{{ gender_option }}" 
                        {% if student.gender == gender_option %}selected{% endif %}>
                        {{ gender_option }}
                    </option>
                {% endfor %}
            </select>
        </div>
        
        <!-- Submit Button -->
        <button type="submit">Update</button>
    </form>
</div>

<script>
    function previewImage(event) {
        const preview = document.getElementById('profilePreview');
        const file = event.target.files[0];
        const reader = new FileReader();
        
        // Remove "remove photo" option when uploading new photo
        const removeCheckbox = document.getElementById('remove_photo');
        if (removeCheckbox) removeCheckbox.checked = false;
        
        reader.onload = function() {
            if (preview.tagName === 'IMG') {
                preview.src = reader.result;
            } else {
                // Replace div with image
                const img = document.createElement('img');
                img.id = 'profilePreview';
                img.src = reader.result;
                img.style = 'width:150px;height:150px;object-fit:cover;border-radius:50%;';
                preview.parentNode.replaceChild(img, preview);
            }
        }
        
        if (file) {
            reader.readAsDataURL(file);
        }
    }
</script>
{% endblock %}
