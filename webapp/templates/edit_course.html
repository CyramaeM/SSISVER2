{% extends "base.html" %}

{% block title %}Edit Course{% endblock %}

{% block content %}
<div class="form-container">
    <h1>Edit Course</h1>
    <form id="editCourseForm" action="{{ url_for('course.edit_course', coursecode=course.coursecode) }}" method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">


        <!-- Course Code -->
        <div class="form-group">
            <label for="course_code">Course Code:</label>
            <input type="text" name="course_code" id="course_code" value="{{ course.coursecode }}" class="form-control" readonly required>
        </div>
        
        <!-- Course Name -->
        <div class="form-group">
            <label for="course_name">Course Name:</label>
            <input type="text" name="course_name" id="course_name" value="{{ course.coursename }}" class="form-control" required>
        </div>

        <div class="form-group">
                <label for="college">College:</label>
                <select name="college" id="college" class="form-control" required>
                    <option value="">Select College</option>
                    {% for college in colleges %}
                    <option value="{{ college.collegecode }}" 
                {% if college.collegecode == course.collegecode %}selected{% endif %}>
                {{ college.collegename }}
        </option>

                    {% endfor %}
                </select>
                <span id="collegeError" class="error"></span>
            </div>
        
        <!-- Submit Button -->
        <button type="submit" class="btn btn-primary">Update</button>
    </form>
</div>
{% endblock %}
