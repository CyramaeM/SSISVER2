<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}My Flask App{% endblock %}</title>
    <link rel="stylesheet" href='/static/style.css'>
    <link rel="stylesheet" href='/static/form.css'>
    <link rel="stylesheet" href='/static/base.css'>
    <link rel="stylesheet" href='/static/add.css'>
    <link rel="stylesheet" href='/static/search.css'>
</head>
<body>
    <nav class="navbar">
        <ul>
                <li><a href="{{ url_for('students.home') }}">Student</a></li>
                <li><a href="{{ url_for('college.college') }}">College</a></li>
                <li><a href="{{ url_for('course.course') }}">Course</a></li>
                <li>
                    <div class="search-form">
                        <input type="text" id="globalSearch" placeholder="Search ...">
                        <button id="searchButton"><i class="fas fa-search"></i> Search</button>
                    </div>
                </li>
        </ul>
    </nav>
    
    <div class="content">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <ul class="flashes">
                    {% for category, message in messages %}
                        <li class="{{ category }}">{{ message }}</li>
                    {% endfor %}
                </ul>
            {% endif %}
        {% endwith %}
    </div>
    
    <div class="content">
        {% block content %}{% endblock %}
    </div>
    
    <script>
    // Global table search functionality
    function filterTable() {
        const input = document.getElementById("globalSearch");
        const filter = input.value.toLowerCase();
        const tables = document.querySelectorAll("table");
        
        tables.forEach(table => {
            const tr = table.querySelectorAll("tbody tr");
            
            for (let i = 0; i < tr.length; i++) {
                const tds = tr[i].querySelectorAll("td");
                let found = false;
                
                for (let j = 0; j < tds.length; j++) {
                    if (tds[j]) {
                        const txtValue = tds[j].textContent || tds[j].innerText;
                        if (txtValue.toLowerCase().includes(filter)) {
                            found = true;
                            break; // Show row if any cell matches
                        }
                    }
                }
                
                tr[i].style.display = found ? "" : "none";
            }
        });
    }

    // Add event listeners
    document.addEventListener('DOMContentLoaded', function() {
        const searchInput = document.getElementById('globalSearch');
        const searchButton = document.getElementById('searchButton');
        
        searchInput.addEventListener('input', filterTable);
        searchButton.addEventListener('click', filterTable);
    });
    </script>
</body>
</html>
