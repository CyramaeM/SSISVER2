{% extends "base.html" %}

{% block title %}College List{% endblock %}

{% block content %}
<h2>College Information</h2>

<!-- College Table -->
<table border="1" id="collegeTable">
    <thead>
        <tr>
            <th>Code</th>
            <th>Name</th>
            <th>
                <div class="add-container" style="position: relative;">
                    <a href="{{ url_for('college.add_college') }}" class="btn-add" title="Add College">
                        <i class="fas fa-user-plus"></i> Add College
                    </a>                    
                    </div>
                </div>
            </th>            
        </tr>
    </thead>
    <tbody>
        {% for college in colleges %}
        <tr>
            <td>{{ college.collegecode }}</td>
            <td>{{ college.collegename }}</td>
            <td>
                <a href="{{ url_for('college.edit_college', college_code=college.collegecode) }}" 
                    class="btn-action btn-edit" 
                    title="Edit College">
                    <i class="fas fa-edit"></i> Edit
                </a>
                <form action="{{ url_for('college.delete_college', college_code=college.collegecode) }}" 
                        method="POST" 
                        onsubmit="return confirmDelete()"
                        style="display: inline;">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <button type="submit" 
                            class="btn-action btn-delete" 
                            title="Delete College">
                        <i class="fas fa-trash-alt"></i> Delete
                    </button>
                </form>                
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
<script>
    function confirmDelete() {
        return confirm("Are you sure you want to delete this college?");
    }
    </script>

{% endblock %}
