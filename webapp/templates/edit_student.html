{% extends "base.html" %}

{% block title %}Edit Student{% endblock %}

{% block content %}
<div class="form-container">
    <h1>Edit Student</h1>
    <form id="editStudentForm" action="{{ url_for('students.edit_student', student_id=student.id_number) }}" method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        
        <!-- ID Number -->
        <div class="form-group">
            <label for="id_number">ID Number:</label>
            <input type="text" name="id_number" id="id_number" value="{{ student.id_number }}" readonly required>
        </div>
        
        <!-- First Name -->
        <div class="form-group">
            <label for="fname">First Name:</label>
            <input type="text" name="fname" id="fname" value="{{ student.fname }}" required>
        </div>
        
        <!-- Last Name -->
        <div class="form-group">
            <label for="lname">Last Name:</label>
            <input type="text" name="lname" id="lname" value="{{ student.lname }}" required>
        </div>
        
        <!-- Course Dropdown -->
        <div class="form-group">
            <label for="course">Course:</label>
            <select name="course" id="course" required>
                {% for course_code in courses %}
                    <option value="{{ course_code }}" 
                        {% if student.course == course_code %}selected{% endif %}>
                        {{ course_code }}
                    </option>
                {% endfor %}
            </select>
        </div>
        
        <!-- Year Level Dropdown -->
        <div class="form-group">
            <label for="yearlevel">Year Level:</label>
            <select name="yearlevel" id="yearlevel" required>
                {% for level in year_levels %}
                    <option value="{{ level }}" 
                        {% if student.yearlevel == level %}selected{% endif %}>
                        {{ level }}
                    </option>
                {% endfor %}
            </select>
        </div>
        
        <!-- Gender Dropdown -->
        <div class="form-group">
            <label for="gender">Gender:</label>
            <select name="gender" id="gender" required>
                {% for gender_option in genders %}
                    <option value="{{ gender_option }}" 
                        {% if student.gender == gender_option %}selected{% endif %}>
                        {{ gender_option }}
                    </option>
                {% endfor %}
            </select>
        </div>
        
        <!-- Submit Button -->
        <button type="submit">Update</button>
    </form>
</div>
{% endblock %}
